name: Build ZMK firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: zmkfirmware/zmk-build-arm:stable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create workspace
        run: |
          mkdir -p /tmp/zmk-config/config
          cp -R config/* /tmp/zmk-config/config/

      - name: West init
        working-directory: /tmp/zmk-config
        run: west init -l config

      - name: West update
        working-directory: /tmp/zmk-config
        run: west update --fetch-opt=--filter=tree:0

      - name: Install Python tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pip

      - name: Install Zephyr Python requirements
        working-directory: /tmp/zmk-config
        run: python3 -m pip install --break-system-packages -r zephyr/scripts/requirements.txt

      - name: Export Zephyr CMake package
        working-directory: /tmp/zmk-config
        run: west zephyr-export

      - name: Patch ZMK board metadata for Zephyr 4.4
        working-directory: /tmp/zmk-config
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          patched_files = []

          def patch_board_entry(entry):
              if not isinstance(entry, dict):
                  return False

              name = entry.get("name")
              if not name:
                  return False

              if "full_name" not in entry:
                  entry["full_name"] = name
                  return True

              return False

          for path in Path("zmk/app").rglob("board.yml"):
              with path.open("r") as f:
                  data = yaml.safe_load(f)

              if not isinstance(data, dict):
                  continue

              changed = False

              board = data.get("board")
              if board is not None:
                  changed |= patch_board_entry(board)

              boards = data.get("boards")
              if isinstance(boards, list):
                  for board_entry in boards:
                      changed |= patch_board_entry(board_entry)

              if changed:
                  with path.open("w") as f:
                      yaml.safe_dump(data, f, sort_keys=False)

                  patched_files.append(str(path))

          print("Patched board metadata:")
          for path in patched_files:
              print(f"  {path}")

          print(f"Total patched files: {len(patched_files)}")
          PY

      - name: Build XIAO nRF54LM20A test firmware
        working-directory: /tmp/zmk-config
        run: |
          west build -s zmk/app -d build -b "xiao_nrf54lm20a/nrf54lm20a/cpuapp" -- -DZMK_CONFIG=/tmp/zmk-config/config -DSHIELD=settings_reset -DBOARD_ROOT=/tmp/zmk-config/modules/platform-seeedboard/zephyr
