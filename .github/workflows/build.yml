name: Build ZMK firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: zmkfirmware/zmk-build-arm:stable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create workspace
        run: |
          mkdir -p /tmp/zmk-config/config
          cp -R config/* /tmp/zmk-config/config/

      - name: West init
        working-directory: /tmp/zmk-config
        run: west init -l config

      - name: West update
        working-directory: /tmp/zmk-config
        run: west update --fetch-opt=--filter=tree:0

      - name: Install Python tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pip xz-utils wget

      - name: Install Zephyr Python requirements
        working-directory: /tmp/zmk-config
        run: python3 -m pip install --break-system-packages -r zephyr/scripts/requirements.txt

      - name: Export Zephyr CMake package
        working-directory: /tmp/zmk-config
        run: west zephyr-export

      - name: Install Zephyr SDK 1.0
        working-directory: /tmp/zmk-config/zephyr
        run: |
          west sdk install --version 1.0.0 --install-dir /opt/zephyr-sdk-1.0.0

      - name: Patch ZMK board metadata for Zephyr 4.4
        working-directory: /tmp/zmk-config
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          count = 0

          for path in Path("zmk/app").rglob("board.yml"):
              with path.open() as f:
                  data = yaml.safe_load(f)

              if not isinstance(data, dict):
                  continue

              changed = False

              if isinstance(data.get("board"), dict):
                  board = data["board"]

                  if board.get("name") and not board.get("full_name"):
                      board["full_name"] = board["name"]
                      changed = True

              if isinstance(data.get("boards"), list):
                  for board in data["boards"]:
                      if not isinstance(board, dict):
                          continue

                      if board.get("name") and not board.get("full_name"):
                          board["full_name"] = board["name"]
                          changed = True

              if changed:
                  with path.open("w") as f:
                      yaml.safe_dump(data, f, sort_keys=False)

                  print(f"Patched: {path}")
                  count += 1

          print(f"Total patched: {count}")
          PY

          echo
          echo "=== VERIFY BLUEMICRO840 ==="
          cat zmk/app/module/boards/jpconstantineau/bluemicro840/board.yml

          echo
          echo "=== VERIFY ADV360 ==="
          cat zmk/app/boards/kinesis/adv360pro/board.yml



      - name: Patch Nordic compatibility for Zephyr 4.4
        working-directory: /tmp/zmk-config
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # ------------------------------------------------------------
          # 1. Remove ZMK's obsolete NRF_SOC_VALIDATE_HEADERS_DISABLED
          #    Kconfig override. Zephyr 4.4 no longer defines it.
          # ------------------------------------------------------------
          path = Path("zmk/app/Kconfig")
          text = path.read_text()

          pattern = re.compile(
              r'\nif SOC_FAMILY_NORDIC_NRF\s+'
              r'config NRF_SOC_VALIDATE_HEADERS_DISABLED\s+'
              r'default y\s+'
              r'endif\s*',
              re.MULTILINE
          )

          text, count = pattern.subn("\n", text, count=1)

          if count != 1:
              raise SystemExit(
                  f"Expected to remove 1 NRF_SOC_VALIDATE_HEADERS_DISABLED block, removed {count}"
              )

          path.write_text(text)

          print("Removed obsolete NRF_SOC_VALIDATE_HEADERS_DISABLED Kconfig block")

          # ------------------------------------------------------------
          # 2. Zephyr 4.4 unconditionally builds Nordic's
          #    validate_binding_headers.c.
          #
          #    That validator force-includes ZMK's external DT binding
          #    headers without ZMK's app/include search path and fails.
          #
          #    Disable this build-time validation helper for our temporary
          #    ZMK/Zephyr 4.4 compatibility build.
          # ------------------------------------------------------------
          path = Path("zephyr/soc/nordic/CMakeLists.txt")
          text = path.read_text()

          old = """zephyr_library_sources(
            validate_base_addresses.c
            validate_binding_headers.c
            validate_enabled_instances.c
            )
          """

          new = """zephyr_library_sources(
            validate_base_addresses.c
            validate_enabled_instances.c
            )
          """

          if old not in text:
              raise SystemExit(
                  "Could not locate Nordic validate_binding_headers.c source block"
              )

          path.write_text(text.replace(old, new, 1))

          print("Disabled Nordic validate_binding_headers.c build-time validator")
          PY

          echo
          echo "=== VERIFY NORDIC VALIDATION PATCH ==="

          python3 - <<'PY'

          from pathlib import Path

          text = Path("zephyr/soc/nordic/CMakeLists.txt").read_text()

          active_block = """zephyr_library_sources(

            validate_base_addresses.c

            validate_binding_headers.c

            validate_enabled_instances.c

            )

          """

          if active_block in text:

              raise SystemExit(

                  "ERROR: validate_binding_headers.c is still in the active source block"

              )

          print("Nordic binding-header validator disabled")

          PY


      



      


      
      - name: Patch ZMK for Zephyr input-only matrix support
        working-directory: /tmp/zmk-config
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("zmk/app/src/physical_layouts.c")
          lines = path.read_text().splitlines()

          def find_exact(value, start=0):
              for i in range(start, len(lines)):
                  if lines[i] == value:
                      return i
              raise RuntimeError(f"Could not find line: {value!r}")

          def find_prefix(value, start=0):
              for i in range(start, len(lines)):
                  if lines[i].startswith(value):
                      return i
              raise RuntimeError(f"Could not find prefix: {value!r}")

          # 1. Remove legacy header.
          idx = find_exact("#include <zephyr/drivers/kscan.h>")
          del lines[idx]

          # 2. Remove legacy callback, preserving the shared message processor.
          start = find_prefix("static void zmk_physical_layout_kscan_callback(")
          end = find_prefix("static void zmk_physical_layouts_kscan_process_msgq(", start)
          del lines[start:end]

          # 3. Remove shutdown block, preserving new_idx and following logic.
          start = find_exact("    if (active) {")
          end = find_exact("    int new_idx = get_index_of_layout(dest_layout);", start)
          del lines[start:end]

          # 4. Remove startup block, preserving active assignment and return.
          active_idx = find_exact("    active = dest_layout;")
          start = find_exact("    if (active->kscan) {", active_idx)
          end = find_exact("    return 0;", start)
          del lines[start:end]

          # 5. Remove PM wakeup loop that only operates on legacy kscan devices.
          init_idx = find_exact("static int zmk_physical_layouts_init(void) {")
          pm_start = find_exact("#if IS_ENABLED(CONFIG_PM_DEVICE)", init_idx)
          pm_end = find_exact("#endif // IS_ENABLED(CONFIG_PM_DEVICE)", pm_start)
          del lines[pm_start:pm_end + 1]

          path.write_text("\n".join(lines) + "\n")

          print("Removed legacy kscan API from physical_layouts.c")
          PY

          python3 - <<'PY'
          from pathlib import Path

          path = Path("zmk/app/Kconfig")
          text = path.read_text()

          old = """if ZMK_KSCAN

          config ZMK_KSCAN_EVENT_QUEUE_SIZE
              int "Size of the event queue for KSCAN events to buffer events"
              default 4

          endif # ZMK_KSCAN
          """

          new = """config ZMK_KSCAN_EVENT_QUEUE_SIZE
              int "Size of the event queue for matrix input events to buffer events"
              default 4
          """

          if old not in text:
              raise SystemExit("Could not locate ZMK_KSCAN_EVENT_QUEUE_SIZE block")

          path.write_text(text.replace(old, new, 1))

          print("Moved matrix event queue config outside legacy ZMK_KSCAN")
          PY

          echo 'CONFIG_ZMK_KSCAN=n' >> zmk/app/prj.conf

          echo
          echo "=== VERIFY LEGACY KSCAN REFERENCES ==="
          if grep -nE \
            'zephyr/drivers/kscan.h|kscan_disable_callback|kscan_enable_callback|kscan_config|zmk_physical_layout_kscan_callback|active->kscan|pl->kscan' \
            zmk/app/src/physical_layouts.c
          then
            echo "ERROR: legacy kscan references remain"
            exit 1
          else
            echo "Legacy kscan references successfully removed"
          fi


      - name: Remove legacy settings-reset kscan
        working-directory: /tmp/zmk-config
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("zmk/app/boards/shields/settings_reset/settings_reset.overlay")
          text = path.read_text()

          text = text.replace(
              """    chosen {
                  zmk,kscan = &settings_reset_kscan;
              };

          """,
              "",
              1,
          )

          text = text.replace(
              """    settings_reset_kscan: settings_reset_kscan {
                  compatible = "zmk,kscan-mock";
                  columns = <1>;
                  rows = <0>;

                  events = <>;
              };

          """,
              "",
              1,
          )

          path.write_text(text)

          print("Removed legacy settings_reset mock kscan")
          PY

          echo
          echo "=== SETTINGS RESET OVERLAY ==="
          cat zmk/app/boards/shields/settings_reset/settings_reset.overlay






      - name: Build XIAO nRF54LM20A test firmware
        working-directory: /tmp/zmk-config
        env:
          ZEPHYR_SDK_INSTALL_DIR: /opt/zephyr-sdk-1.0.0
        run: |
          west build -s zmk/app -d build -b "xiao_nrf54lm20a/nrf54lm20a/cpuapp" -- -DZMK_CONFIG=/tmp/zmk-config/config -DSHIELD=settings_reset -DBOARD_ROOT=/tmp/zmk-config/modules/platform-seeedboard/zephyr -DEXTRA_DTC_OVERLAY_FILE=/tmp/zmk-config/config/xiao_test.keymap
