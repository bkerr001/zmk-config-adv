name: Build ZMK firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: zmkfirmware/zmk-build-arm:stable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create workspace
        run: |
          mkdir -p /tmp/zmk-config/config
          cp -R config/* /tmp/zmk-config/config/

      - name: West init
        working-directory: /tmp/zmk-config
        run: west init -l config

      - name: West update
        working-directory: /tmp/zmk-config
        run: west update --fetch-opt=--filter=tree:0

      - name: Install Python tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pip xz-utils wget

      - name: Install Zephyr Python requirements
        working-directory: /tmp/zmk-config
        run: python3 -m pip install --break-system-packages -r zephyr/scripts/requirements.txt

      - name: Export Zephyr CMake package
        working-directory: /tmp/zmk-config
        run: west zephyr-export

      - name: Install Zephyr SDK 1.0
        working-directory: /tmp/zmk-config/zephyr
        run: |
          west sdk install --version 1.0.0 --install-dir /opt/zephyr-sdk-1.0.0

      - name: Patch ZMK board metadata for Zephyr 4.4
        working-directory: /tmp/zmk-config
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          count = 0

          for path in Path("zmk/app").rglob("board.yml"):
              with path.open() as f:
                  data = yaml.safe_load(f)

              if not isinstance(data, dict):
                  continue

              changed = False

              if isinstance(data.get("board"), dict):
                  board = data["board"]

                  if board.get("name") and not board.get("full_name"):
                      board["full_name"] = board["name"]
                      changed = True

              if isinstance(data.get("boards"), list):
                  for board in data["boards"]:
                      if not isinstance(board, dict):
                          continue

                      if board.get("name") and not board.get("full_name"):
                          board["full_name"] = board["name"]
                          changed = True

              if changed:
                  with path.open("w") as f:
                      yaml.safe_dump(data, f, sort_keys=False)

                  print(f"Patched: {path}")
                  count += 1

          print(f"Total patched: {count}")
          PY

          echo
          echo "=== VERIFY BLUEMICRO840 ==="
          cat zmk/app/module/boards/jpconstantineau/bluemicro840/board.yml

          echo
          echo "=== VERIFY ADV360 ==="
          cat zmk/app/boards/kinesis/adv360pro/board.yml

      - name: Patch ZMK for Zephyr input-only matrix support
        working-directory: /tmp/zmk-config
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("zmk/app/src/physical_layouts.c")
          text = path.read_text()

          # Guard the removed Zephyr kscan header.
          old = '#include <zephyr/drivers/kscan.h>\n'
          new = (
              '#if IS_ENABLED(CONFIG_ZMK_KSCAN)\n'
              '#include <zephyr/drivers/kscan.h>\n'
              '#endif\n'
          )

          if old not in text:
              raise SystemExit("Could not find kscan include")

          text = text.replace(old, new, 1)

          # Guard the legacy kscan callback.
          old = '''static void zmk_physical_layout_kscan_callback(const struct device *dev, uint32_t row,
                                                   uint32_t column, bool pressed) {
              if (dev != active->kscan) {
                  return;
              }

              struct zmk_kscan_event ev = {
                  .row = row,
                  .column = column,
                  .state = (pressed ? ZMK_KSCAN_EVENT_STATE_PRESSED : ZMK_KSCAN_EVENT_STATE_RELEASED)};

              k_msgq_put(&physical_layouts_kscan_msgq, &ev, K_NO_WAIT);
              k_work_submit(&msg_processor.work);
          }
          '''

          new = '''#if IS_ENABLED(CONFIG_ZMK_KSCAN)
          static void zmk_physical_layout_kscan_callback(const struct device *dev, uint32_t row,
                                                         uint32_t column, bool pressed) {
              if (dev != active->kscan) {
                  return;
              }

              struct zmk_kscan_event ev = {
                  .row = row,
                  .column = column,
                  .state = (pressed ? ZMK_KSCAN_EVENT_STATE_PRESSED : ZMK_KSCAN_EVENT_STATE_RELEASED)};

              k_msgq_put(&physical_layouts_kscan_msgq, &ev, K_NO_WAIT);
              k_work_submit(&msg_processor.work);
          }
          #endif
          '''

          if old not in text:
              raise SystemExit("Could not find legacy kscan callback")

          text = text.replace(old, new, 1)

          # Guard shutdown of a legacy kscan device.
          old = '''    if (active) {
              if (active->kscan) {
                  kscan_disable_callback(active->kscan);
          #if IS_ENABLED(CONFIG_PM_DEVICE_RUNTIME)
                  pm_device_runtime_put(active->kscan);
          #elif IS_ENABLED(CONFIG_PM_DEVICE)
                  pm_device_action_run(active->kscan, PM_DEVICE_ACTION_SUSPEND);
          #endif
              }
          }
          '''

          new = '''    if (active) {
          #if IS_ENABLED(CONFIG_ZMK_KSCAN)
              if (active->kscan) {
                  kscan_disable_callback(active->kscan);
          #if IS_ENABLED(CONFIG_PM_DEVICE_RUNTIME)
                  pm_device_runtime_put(active->kscan);
          #elif IS_ENABLED(CONFIG_PM_DEVICE)
                  pm_device_action_run(active->kscan, PM_DEVICE_ACTION_SUSPEND);
          #endif
              }
          #endif
          }
          '''

          if old not in text:
              raise SystemExit("Could not find legacy kscan shutdown block")

          text = text.replace(old, new, 1)

          # Guard startup/configuration of a legacy kscan device.
          old = '''    active = dest_layout;
              if (active->kscan) {
          #if IS_ENABLED(CONFIG_PM_DEVICE_RUNTIME)
                  int err = pm_device_runtime_get(active->kscan);
                  if (err < 0) {
                      LOG_WRN("PM runtime get of kscan device to enable it %d", err);
                      return err;
                  }
          #elif IS_ENABLED(CONFIG_PM_DEVICE)
                  pm_device_action_run(active->kscan, PM_DEVICE_ACTION_RESUME);
          #endif
                  kscan_config(active->kscan, zmk_physical_layout_kscan_callback);
                  kscan_enable_callback(active->kscan);
              }
          '''

          new = '''    active = dest_layout;
          #if IS_ENABLED(CONFIG_ZMK_KSCAN)
              if (active->kscan) {
          #if IS_ENABLED(CONFIG_PM_DEVICE_RUNTIME)
                  int err = pm_device_runtime_get(active->kscan);
                  if (err < 0) {
                      LOG_WRN("PM runtime get of kscan device to enable it %d", err);
                      return err;
                  }
          #elif IS_ENABLED(CONFIG_PM_DEVICE)
                  pm_device_action_run(active->kscan, PM_DEVICE_ACTION_RESUME);
          #endif
                  kscan_config(active->kscan, zmk_physical_layout_kscan_callback);
                  kscan_enable_callback(active->kscan);
              }
          #endif
          '''

          if old not in text:
              raise SystemExit("Could not find legacy kscan startup block")

          text = text.replace(old, new, 1)
          path.write_text(text)

          # The queue is used by BOTH legacy kscan and the new Zephyr input callback,
          # so its Kconfig option must remain defined when ZMK_KSCAN=n.
          path = Path("zmk/app/Kconfig")
          text = path.read_text()

          old = '''if ZMK_KSCAN

          config ZMK_KSCAN_EVENT_QUEUE_SIZE
              int "Size of the event queue for KSCAN events to buffer events"
              default 4

          endif # ZMK_KSCAN
          '''

          new = '''config ZMK_KSCAN_EVENT_QUEUE_SIZE
              int "Size of the event queue for matrix input events to buffer events"
              default 4
          '''

          if old not in text:
              raise SystemExit("Could not find ZMK_KSCAN_EVENT_QUEUE_SIZE block")

          path.write_text(text.replace(old, new, 1))

          print("Patched physical_layouts.c for input-only operation")
          print("Made matrix event queue available without legacy KSCAN")
          PY

          echo 'CONFIG_ZMK_KSCAN=n' >> zmk/app/prj.conf

      - name: Build XIAO nRF54LM20A test firmware

        working-directory: /tmp/zmk-config

        env:

          ZEPHYR_SDK_INSTALL_DIR: /opt/zephyr-sdk-1.0.0

        run: |

          west build -s zmk/app -d build -b "xiao_nrf54lm20a/nrf54lm20a/cpuapp" -- -DZMK_CONFIG=/tmp/zmk-config/config -DSHIELD=settings_reset -DBOARD_ROOT=/tmp/zmk-config/modules/platform-seeedboard/zephyr
