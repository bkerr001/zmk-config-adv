name: Build ZMK firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: zmkfirmware/zmk-build-arm:stable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create workspace
        run: |
          mkdir -p /tmp/zmk-config/config
          cp -R config/* /tmp/zmk-config/config/

      - name: West init
        working-directory: /tmp/zmk-config
        run: west init -l config

      - name: West update
        working-directory: /tmp/zmk-config
        run: west update --fetch-opt=--filter=tree:0

      - name: Install Python tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pip xz-utils wget

      - name: Install Zephyr Python requirements
        working-directory: /tmp/zmk-config
        run: python3 -m pip install --break-system-packages -r zephyr/scripts/requirements.txt

      - name: Export Zephyr CMake package
        working-directory: /tmp/zmk-config
        run: west zephyr-export

      - name: Install Zephyr SDK 1.0
        working-directory: /tmp/zmk-config/zephyr
        run: |
          west sdk install --version 1.0.0 --install-dir /opt/zephyr-sdk-1.0.0

      - name: Patch ZMK board metadata for Zephyr 4.4
        working-directory: /tmp/zmk-config
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          count = 0

          for path in Path("zmk/app").rglob("board.yml"):
              with path.open() as f:
                  data = yaml.safe_load(f)

              if not isinstance(data, dict):
                  continue

              changed = False

              if isinstance(data.get("board"), dict):
                  board = data["board"]

                  if board.get("name") and not board.get("full_name"):
                      board["full_name"] = board["name"]
                      changed = True

              if isinstance(data.get("boards"), list):
                  for board in data["boards"]:
                      if not isinstance(board, dict):
                          continue

                      if board.get("name") and not board.get("full_name"):
                          board["full_name"] = board["name"]
                          changed = True

              if changed:
                  with path.open("w") as f:
                      yaml.safe_dump(data, f, sort_keys=False)

                  print(f"Patched: {path}")
                  count += 1

          print(f"Total patched: {count}")
          PY

          echo
          echo "=== VERIFY BLUEMICRO840 ==="
          cat zmk/app/module/boards/jpconstantineau/bluemicro840/board.yml

          echo
          echo "=== VERIFY ADV360 ==="
          cat zmk/app/boards/kinesis/adv360pro/board.yml

      - name: Patch ZMK for Zephyr input-only matrix support
        working-directory: /tmp/zmk-config
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("zmk/app/src/physical_layouts.c")
          text = path.read_text()

          # Remove legacy Zephyr kscan header.
          text, count = re.subn(
              r'^#include <zephyr/drivers/kscan\.h>\n',
              '',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit(f"Expected to remove 1 kscan include, removed {count}")

          # Remove legacy ZMK kscan callback.
          text, count = re.subn(
              r'static void zmk_physical_layout_kscan_callback\(.*?'
              r'\n\}\n(?=static void zmk_physical_layouts_kscan_process_msgq)',
              '',
              text,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit(f"Expected to remove 1 legacy callback, removed {count}")

          # Remove legacy kscan shutdown block.
          text, count = re.subn(
              r'    if \(active\) \{\n'
              r'        if \(active->kscan\) \{\n'
              r'.*?'
              r'        \}\n'
              r'    \}\n',
              '',
              text,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit(f"Expected to remove 1 kscan shutdown block, removed {count}")

          # Remove legacy kscan startup block after active = dest_layout.
          text, count = re.subn(
              r'(    active = dest_layout;\n)'
              r'    if \(active->kscan\) \{\n'
              r'.*?'
              r'    \}\n',
              r'\1',
              text,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit(f"Expected to remove 1 kscan startup block, removed {count}")

          path.write_text(text)

          print("Removed legacy kscan include/callback/startup/shutdown from physical_layouts.c")

          # Keep the event queue available for the newer Zephyr input path.
          path = Path("zmk/app/Kconfig")
          text = path.read_text()

          pattern = re.compile(
              r'if ZMK_KSCAN\s+'
              r'config ZMK_KSCAN_EVENT_QUEUE_SIZE\s+'
              r'int "Size of the event queue for KSCAN events to buffer events"\s+'
              r'default 4\s+'
              r'endif # ZMK_KSCAN',
              re.MULTILINE,
          )

          replacement = '''config ZMK_KSCAN_EVENT_QUEUE_SIZE
              int "Size of the event queue for matrix input events to buffer events"
              default 4'''

          text, count = pattern.subn(replacement, text, count=1)

          if count != 1:
              raise SystemExit(
                  f"Expected to move 1 event queue Kconfig block, moved {count}"
              )

          path.write_text(text)

          print("Made matrix event queue independent of legacy ZMK_KSCAN")
          PY

          echo 'CONFIG_ZMK_KSCAN=n' >> zmk/app/prj.conf

          echo "=== VERIFY NO LEGACY KSCAN HEADER ==="
          if grep -n 'zephyr/drivers/kscan.h' zmk/app/src/physical_layouts.c; then
            echo "ERROR: legacy kscan header still present"
            exit 1
          else
            echo "Legacy kscan header removed"
          fi

          echo "=== VERIFY KSCAN CONFIG ==="
          tail -5 zmk/app/prj.conf
      - name: Build XIAO nRF54LM20A test firmware

        working-directory: /tmp/zmk-config

        env:

          ZEPHYR_SDK_INSTALL_DIR: /opt/zephyr-sdk-1.0.0

        run: |

          west build -s zmk/app -d build -b "xiao_nrf54lm20a/nrf54lm20a/cpuapp" -- -DZMK_CONFIG=/tmp/zmk-config/config -DSHIELD=settings_reset -DBOARD_ROOT=/tmp/zmk-config/modules/platform-seeedboard/zephyr
