name: Build ZMK firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: zmkfirmware/zmk-build-arm:stable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create workspace
        run: |
          mkdir -p /tmp/zmk-config/config
          cp -R config/* /tmp/zmk-config/config/

      - name: West init
        working-directory: /tmp/zmk-config
        run: west init -l config

      - name: West update
        working-directory: /tmp/zmk-config
        run: west update --fetch-opt=--filter=tree:0

      - name: Install Python tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pip xz-utils wget

      - name: Install Zephyr Python requirements
        working-directory: /tmp/zmk-config
        run: python3 -m pip install --break-system-packages -r zephyr/scripts/requirements.txt

      - name: Export Zephyr CMake package
        working-directory: /tmp/zmk-config
        run: west zephyr-export

      - name: Install Zephyr SDK 1.0
        working-directory: /tmp/zmk-config/zephyr
        run: |
          west sdk install --version 1.0.0 --install-dir /opt/zephyr-sdk-1.0.0

      - name: Patch ZMK board metadata for Zephyr 4.4
        working-directory: /tmp/zmk-config
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          count = 0

          for path in Path("zmk/app").rglob("board.yml"):
              with path.open() as f:
                  data = yaml.safe_load(f)

              if not isinstance(data, dict):
                  continue

              changed = False

              if isinstance(data.get("board"), dict):
                  board = data["board"]

                  if board.get("name") and not board.get("full_name"):
                      board["full_name"] = board["name"]
                      changed = True

              if isinstance(data.get("boards"), list):
                  for board in data["boards"]:
                      if not isinstance(board, dict):
                          continue

                      if board.get("name") and not board.get("full_name"):
                          board["full_name"] = board["name"]
                          changed = True

              if changed:
                  with path.open("w") as f:
                      yaml.safe_dump(data, f, sort_keys=False)

                  print(f"Patched: {path}")
                  count += 1

          print(f"Total patched: {count}")
          PY

          echo
          echo "=== VERIFY BLUEMICRO840 ==="
          cat zmk/app/module/boards/jpconstantineau/bluemicro840/board.yml

          echo
          echo "=== VERIFY ADV360 ==="
          cat zmk/app/boards/kinesis/adv360pro/board.yml



      - name: Remove obsolete Nordic Kconfig block
        working-directory: /tmp/zmk-config
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("zmk/app/Kconfig")
          text = path.read_text()

          pattern = re.compile(
              r'\nif SOC_FAMILY_NORDIC_NRF\s+'
              r'config NRF_SOC_VALIDATE_HEADERS_DISABLED\s+'
              r'default y\s+'
              r'endif\s*',
              re.MULTILINE
          )

          text, count = pattern.subn("\n", text, count=1)

          if count != 1:
              raise SystemExit(
                  f"Expected to remove 1 NRF_SOC_VALIDATE_HEADERS_DISABLED block, removed {count}"
              )

          path.write_text(text)

          print("Removed obsolete NRF_SOC_VALIDATE_HEADERS_DISABLED block")
          PY

      - name: Patch ZMK for Zephyr input-only matrix support
        working-directory: /tmp/zmk-config
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("zmk/app/src/physical_layouts.c")
          text = path.read_text()

          # 1. Remove legacy Zephyr kscan header.
          old = "#include <zephyr/drivers/kscan.h>\n"

          if old not in text:
              raise SystemExit("Legacy kscan header not found")

          text = text.replace(old, "", 1)

          # 2. Remove legacy kscan callback.
          start_marker = "static void zmk_physical_layout_kscan_callback("
          end_marker = "static void zmk_physical_layouts_kscan_process_msgq("

          start = text.find(start_marker)
          end = text.find(end_marker, start)

          if start == -1:
              raise SystemExit("Legacy kscan callback start not found")

          if end == -1:
              raise SystemExit("kscan message processor marker not found")

          text = text[:start] + text[end:]

          # 3. Remove legacy kscan shutdown section.
          start_marker = """    if (active) {
              if (active->kscan) {
          """

          end_marker = "    int new_idx = get_index_of_layout(dest_layout);"

          start = text.find(start_marker)
          end = text.find(end_marker, start)

          if start == -1:
              raise SystemExit("Legacy kscan shutdown start not found")

          if end == -1:
              raise SystemExit("Legacy kscan shutdown end not found")

          text = text[:start] + text[end:]

          # 4. Remove legacy kscan startup section while preserving:
          #    active = dest_layout;
          active_marker = "    active = dest_layout;\n"
          startup_marker = "    if (active->kscan) {\n"
          return_marker = "\n    return 0;\n"

          active_pos = text.find(active_marker)

          if active_pos == -1:
              raise SystemExit("active = dest_layout marker not found")

          startup_pos = text.find(
              startup_marker,
              active_pos + len(active_marker)
          )

          return_pos = text.find(return_marker, startup_pos)

          if startup_pos == -1:
              raise SystemExit("Legacy kscan startup block not found")

          if return_pos == -1:
              raise








      - name: Build XIAO nRF54LM20A test firmware

        working-directory: /tmp/zmk-config

        env:

          ZEPHYR_SDK_INSTALL_DIR: /opt/zephyr-sdk-1.0.0

        run: |

          west build -s zmk/app -d build -b "xiao_nrf54lm20a/nrf54lm20a/cpuapp" -- -DZMK_CONFIG=/tmp/zmk-config/config -DSHIELD=settings_reset -DBOARD_ROOT=/tmp/zmk-config/modules/platform-seeedboard/zephyr
