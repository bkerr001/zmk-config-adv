name: Build ZMK firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: zmkfirmware/zmk-build-arm:stable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create workspace
        run: |
          mkdir -p /tmp/zmk-config/config
          cp -R config/* /tmp/zmk-config/config/

      - name: West init
        working-directory: /tmp/zmk-config
        run: west init -l config

      - name: West update
        working-directory: /tmp/zmk-config
        run: west update --fetch-opt=--filter=tree:0

      - name: Install Python tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pip xz-utils wget

      - name: Install Zephyr Python requirements
        working-directory: /tmp/zmk-config
        run: python3 -m pip install --break-system-packages -r zephyr/scripts/requirements.txt

      - name: Export Zephyr CMake package
        working-directory: /tmp/zmk-config
        run: west zephyr-export

      - name: Install Zephyr SDK 1.0
        working-directory: /tmp/zmk-config/zephyr
        run: |
          west sdk install --version 1.0.0 --install-dir /opt/zephyr-sdk-1.0.0

      - name: Patch ZMK board metadata for Zephyr 4.4
        working-directory: /tmp/zmk-config
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          count = 0

          for path in Path("zmk/app").rglob("board.yml"):
              with path.open() as f:
                  data = yaml.safe_load(f)

              if not isinstance(data, dict):
                  continue

              changed = False

              if isinstance(data.get("board"), dict):
                  board = data["board"]

                  if board.get("name") and not board.get("full_name"):
                      board["full_name"] = board["name"]
                      changed = True

              if isinstance(data.get("boards"), list):
                  for board in data["boards"]:
                      if not isinstance(board, dict):
                          continue

                      if board.get("name") and not board.get("full_name"):
                          board["full_name"] = board["name"]
                          changed = True

              if changed:
                  with path.open("w") as f:
                      yaml.safe_dump(data, f, sort_keys=False)

                  print(f"Patched: {path}")
                  count += 1

          print(f"Total patched: {count}")
          PY

          echo
          echo "=== VERIFY BLUEMICRO840 ==="
          cat zmk/app/module/boards/jpconstantineau/bluemicro840/board.yml

          echo
          echo "=== VERIFY ADV360 ==="
          cat zmk/app/boards/kinesis/adv360pro/board.yml

      - name: Patch ZMK for Zephyr input-only matrix support
        working-directory: /tmp/zmk-config
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("zmk/app/src/physical_layouts.c")
          lines = path.read_text().splitlines()

          out = []
          i = 0

          while i < len(lines):
              line = lines[i]

              # 1. Guard legacy kscan header.
              if line == "#include <zephyr/drivers/kscan.h>":
                  out.extend([
                      "#if IS_ENABLED(CONFIG_ZMK_KSCAN)",
                      line,
                      "#endif",
                  ])
                  i += 1
                  continue

              # 2. Guard legacy kscan callback.
              if line.startswith("static void zmk_physical_layout_kscan_callback("):
                  out.append("#if IS_ENABLED(CONFIG_ZMK_KSCAN)")

                  while i < len(lines):
                      out.append(lines[i])

                      if lines[i] == "}":
                          i += 1
                          break

                      i += 1

                  out.append("#endif /* CONFIG_ZMK_KSCAN */")
                  continue

              # 3. Guard shutdown block.
              if line == "    if (active) {" and i + 1 < len(lines) and lines[i + 1] == "        if (active->kscan) {":
                  out.append(line)
                  out.append("#if IS_ENABLED(CONFIG_ZMK_KSCAN)")
                  i += 1

                  depth = 0
                  while i < len(lines):
                      current = lines[i]
                      out.append(current)

                      depth += current.count("{")
                      depth -= current.count("}")

                      i += 1

                      if depth == 0:
                          break

                  out.append("#endif /* CONFIG_ZMK_KSCAN */")

                  # Preserve the closing brace for if (active).
                  if i < len(lines) and lines[i] == "    }":
                      out.append(lines[i])
                      i += 1

                  continue

              # 4. Guard startup block.
              if line == "    if (active->kscan) {" and i > 0 and lines[i - 1] == "    active = dest_layout;":
                  out.append("#if IS_ENABLED(CONFIG_ZMK_KSCAN)")

                  depth = 0
                  while i < len(lines):
                      current = lines[i]
                      out.append(current)

                      depth += current.count("{")
                      depth -= current.count("}")

                      i += 1

                      if depth == 0:
                          break

                  out.append("#endif /* CONFIG_ZMK_KSCAN */")
                  continue

              out.append(line)
              i += 1

          path.write_text("\n".join(out) + "\n")

          # Move ZMK_KSCAN_EVENT_QUEUE_SIZE outside the legacy KSCAN conditional.
          path = Path("zmk/app/Kconfig")
          lines = path.read_text().splitlines()

          out = []
          i = 0
          patched_queue = False

          while i < len(lines):
              if (
                  i + 6 < len(lines)
                  and lines[i] == "if ZMK_KSCAN"
                  and lines[i + 2] == "config ZMK_KSCAN_EVENT_QUEUE_SIZE"
              ):
                  out.extend([
                      "config ZMK_KSCAN_EVENT_QUEUE_SIZE",
                      '    int "Size of the event queue for matrix input events to buffer events"',
                      "    default 4",
                  ])

                  # Skip:
                  # if ZMK_KSCAN
                  # blank
                  # config ...
                  # int ...
                  # default ...
                  # blank
                  # endif ...
                  i += 7
                  patched_queue = True
                  continue

              out.append(lines[i])
              i += 1

          if not patched_queue:
              raise SystemExit("Could not locate ZMK_KSCAN_EVENT_QUEUE_SIZE block")

          path.write_text("\n".join(out) + "\n")

          print("Patched physical_layouts.c for input-only operation")
          print("Moved matrix event queue config outside legacy ZMK_KSCAN")
          PY

          echo 'CONFIG_ZMK_KSCAN=n' >> zmk/app/prj.conf
      - name: Build XIAO nRF54LM20A test firmware

        working-directory: /tmp/zmk-config

        env:

          ZEPHYR_SDK_INSTALL_DIR: /opt/zephyr-sdk-1.0.0

        run: |

          west build -s zmk/app -d build -b "xiao_nrf54lm20a/nrf54lm20a/cpuapp" -- -DZMK_CONFIG=/tmp/zmk-config/config -DSHIELD=settings_reset -DBOARD_ROOT=/tmp/zmk-config/modules/platform-seeedboard/zephyr
