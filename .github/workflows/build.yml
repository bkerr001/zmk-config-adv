
name: Build ZMK firmware

on:

  push:

  pull_request:

  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    container:

      image: zmkfirmware/zmk-build-arm:stable

    steps:

      - name: Checkout

        uses: actions/checkout@v7

      - name: Create workspace

        run: |

          mkdir -p /tmp/zmk-config/config

          cp -R config/* /tmp/zmk-config/config/

      - name: West init

        working-directory: /tmp/zmk-config

        run: |

          west init -l config

      - name: West update

        working-directory: /tmp/zmk-config

        run: |

          west update --fetch-opt=--filter=tree:0

      - name: Install Zephyr Python tooling
        run: |
           apt-get update
           apt-get install -y --no-install-recommends \
             python3-pip \
             python3-venv

      - name: Install Zephyr Python requirements
        working-directory: /tmp/zmk-config
        run: |
           python3 -m pip install --break-system-packages \
             -r zephyr/scripts/requirements.txt

      - name: Zephyr export

        working-directory: /tmp/zmk-config

        run: |

          west zephyr-export

      - name: Show versions

        working-directory: /tmp/zmk-config

        run: |

          west list zephyr -f "Zephyr revision: {revision}"

          west list zmk -f "ZMK revision: {revision}"

          python3 --version

          west --version

      - name: Build XIAO nRF54LM20A test firmware
        working-directory: /tmp/zmk-config
        run: |
          pwd
           ls -la
           ls -la zmk/app
          west build -s zmk/app -d build -b "xiao_nrf54lm20a/nrf54lm20a/cpuapp" -- -DZMK_CONFIG=/tmp/zmk-config/config -DSHIELD=settings_reset -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}"
      - name: Collect artifacts

        if: success()

        working-directory: /tmp/zmk-config

        run: |

          mkdir -p artifacts

          find build/zephyr -maxdepth 1 -type f \

            \( -name '*.uf2' -o -name '*.bin' -o -name '*.hex' \) \

            -exec cp {} artifacts/ \;

      - name: Upload artifacts

        if: success()

        uses: actions/upload-artifact@v4

        with:

          name: xiao-nrf54lm20a-test

          path: /tmp/zmk-config/artifacts/

